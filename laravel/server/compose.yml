# /srv/__APP__/compose.yml
#
# Runs __APP__ as three containers from one image:
#   web        serves HTTP on port 8080, reached through the proxy (/srv/proxy)
#   worker     processes queued jobs
#   scheduler  runs Laravel's scheduled tasks
#
# web-next only runs during a deploy: the new version starts there first and
# replaces web once it is healthy. "docker compose up" leaves it alone.
#
# Settings and secrets live in .env next to this file.

name: __APP__

x-app: &app
  image: __APP__:${APP_TAG:?Set APP_TAG in .env to the image tag to run}
  env_file: .env
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

x-web: &web
  <<: *app
  environment:
    PORT: "8080"
  healthcheck:
    test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/') === false ? 1 : 0);"]
    interval: 30s
    timeout: 5s
    start_period: 60s
    start_interval: 2s
    retries: 3

services:
  web:
    <<: *web
    networks:
      default: {}
      proxy:
        aliases: [__APP__-web]
      __APP__-mysql: {}
      __APP__-redis: {}

  # Not on the proxy network, so it gets no requests until the deploy connects it
  # there for the few seconds web is being replaced.
  web-next:
    <<: *web
    profiles: [next]
    restart: "no"
    networks: [default, __APP__-mysql, __APP__-redis]

  worker:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--max-time=3600"]
    stop_grace_period: 60s
    networks: [default, __APP__-mysql, __APP__-redis]

  scheduler:
    <<: *app
    command: ["php", "artisan", "schedule:work"]
    networks: [default, __APP__-mysql, __APP__-redis]

networks:
  proxy:
    external: true
  # The app's databases (/srv/__APP__-mysql and /srv/__APP__-redis).
  # Using your own database instead? Remove these two and their mentions above.
  __APP__-mysql:
    external: true
  __APP__-redis:
    external: true
